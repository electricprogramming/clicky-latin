<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="Clicky Latin" content="Clicky Latin is a software designed specifically with the goal of helping students to learn Latin via drag-and-drop technology and responsive audio feedback.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <meta name="google-site-verification" content="c2VvJHD-7UVQpVpVi_Y9x3GAge_3c9JJXfz9sC2BPcY" />
  <title>Clicky Latin - Report a Bug</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--background);
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      width: 100vw;
      min-height: 100vh;
      min-width: 100vw;
      overflow-x: hidden;
      overflow-y: auto;
    }
    :root {
      --background: #333;
      --foreground-1: #0d3;
      --foreground-2: #09f;
      --foreground-3: #0d3;
      --foreground-4: #09f;
      --main-text: #fff;
      --minor-text: #fff;
      --bright-text: #fff;
      --main-ui: #ccc;
      --ui-accent: #39d;
    }
    
    /* Removes the down arrow from <input> elements with a list attribute to attach a <datalist> */
    input[list]::-webkit-calendar-picker-indicator {
      display: none;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .heading {
      color: var(--main-text);
      font-family: 'Times New Roman', Times, serif;
      font-size: 10vmin;
      text-align: center;
      margin: 2.5vmin;
    }

    #back-home-svg {
      width: 20vmin;
      height: auto;
      position: fixed;
      bottom: 1vmin;
      right: 1vmin;
      transform: scale(0.9);
      transition: transform 0.3s ease;
      z-index: 100000;
    }
    #back-home-btn {
      user-select: none;
      cursor: pointer;
    }
    form#bug-report-form {
      display: flex;
      flex-direction: column;
      width: 80vw;
      gap: 2vmin;
      max-width: 600px;

      &, * {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      fieldset {
        border: 2px solid var(--main-ui);
        border-radius: 0.5vmin;

        legend {
          font-size: 1.1em;
          color: var(--main-text);
        }
        input, select, textarea {
          margin-top: 1vh;
        }
      }

      label {
        &, * {
          padding: 0;
          margin: 0;
          color: var(--minor-text);
        }
        h1 { color: var(--main-text); }
      }

      .char-counter {
        padding: 0;
        margin-top: -1.5vmin;
        display: inline-block;
        font-size: 0.75em;
        text-align: right;
        vertical-align: middle;
        color: #000;
      }

      input, select, textarea {
        padding: 1vmin;
        font-size: 2.5vmin;
        background-color: #555;
        color: var(--minor-text);
        border: 2px solid var(--main-ui);
        border-radius: 0.5vmin;

        &::placeholder {
          color: var(--minor-text);
          opacity: 0.75;
          filter: saturate(80%);
        }
        
        &:focus {
          border: 2px solid var(--ui-accent);
          outline: none;
          box-shadow: none;
        }
      }
      textarea {
        min-height: 20vh;
        max-height: 20vh;
        resize: none;
      }
      button#bug-report-submit {
        padding: 1.5vmin 3vmin;
        font-size: 2.5vmin;
        background: var(--foreground-3);
        color: var(--bright-text);
        border: none;
        border-radius: 0.5vmin;
        cursor: pointer;
        &:hover {
          filter: brightness(0.9);
        }
      }
    }
  </style>
</head>
<body>
  <div class="heading">Report a Bug</div>
  <form id="bug-report-form" onsubmit="event.preventDefault();">
    <label for="bug-report-title">
      <h1>Title</h1>
      <p>Title your bug report in a few simple words.</p>
    </label>
    <input type="text" id="bug-report-title" name="title" placeholder="Search page does not load" maxlength="40" required>
    <div class="char-counter" id="title-char-counter">0 / 40</div>

    <fieldset id="device-info" style="display: block;">
      <legend>Device Information</legend>
      <label style="margin-top:-1vmin; margin-bottom: 0;">Information about the device where the bug occured.</label>
      <br>

      <label for="bug-device-type">Device&nbsp;type:</label>
      <select id="bug-device-type" name="deviceType" required
        oninvalid="this.setCustomValidity(`Please select your device type.`);" oninput="this.setCustomValidity('');">
        <option value="" selected disabled hidden>Select...</option>
        <option value="phone">Phone</option>
        <option value="tablet">Tablet</option>
        <option value="computer">Computer</option>
        <option value="other">Other</option>
      </select>

      <label for="bug-device-os" title="Device operating system">Device&nbsp;OS:</label>
      <input list="os-list" id="bug-device-os" name="deviceOS"
        placeholder="Start typing or choose..." required
        oninvalid="this.setCustomValidity(`Please select your device manufacturer.`);" oninput="this.setCustomValidity('');"/>
      <datalist id="os-list">
        <option>iOS</option>
        <option>macOS</option>
        <option>Windows</option>
        <option>Linux</option>
        <option>Android</option>
        <option>Chrome OS</option>
        <option>I don't know</option>
      </datalist>

      <label for="bug-device-manufacturer">Device&nbsp;manufacturer:</label>
      <input list="manufacturers-list" id="bug-device-manufacturer" name="deviceManufacturer"
        placeholder="Start typing or choose..." required
        oninvalid="this.setCustomValidity(`Please select your device manufacturer.`);" oninput="this.setCustomValidity('');"/>
      <datalist id="manufacturers-list">
        <option>Apple</option>
        <option>Google</option>
        <option>Samsung</option>
        <option>Microsoft</option>
        <option>Motorola</option>
        <option>Lenovo</option>
        <option>Dell</option>
        <option>Sony</option>
        <option>I don't know</option>
      </datalist>

    </fieldset>

    <label for="bug-report-desc">
      <h1>Description</h1>
      <p>Describe your bug report with more details.</p>
    </label>
    <textarea id="bug-report-desc" name="desc"
      placeholder="When I go to the search page, the search results never load at all and the loading spinner spins forever."
      maxlength="750" required></textarea>
    <div class="char-counter" id="desc-char-counter">0 / 750</div>

    <button id="bug-report-submit" type="submit">Submit bug report</button>
  </form>
  <svg id="back-home-svg" width="555" height="155" viewbox="0 0 555 155" xmlns="http://www.w3.org/2000/svg">
    <a href="/">
      <g id="back-home-btn" transform="translate(2.5,2.5)">
        <path
          d="M 475,0 
            A 75,75 0 1,1 475,150
            H 75
            A 75, 75 0 1,1 75,0
            Z"
          fill="#ddd9" 
          stroke="#222" 
          stroke-width="5" />
        <text fill="#222" font-family="sans-serif" font-size="80" text-anchor="middle" dominant-baseline="middle" x="275" y="85">Back to Home</text>
      </g>
    </a>
  </svg>
  <script type="module"> 
    const homeSVG = document.getElementById('back-home-svg');
    const homeBtn = document.getElementById('back-home-btn');
    homeBtn.addEventListener('mouseenter', () => {
      homeSVG.style.transform = 'scale(1.0)';
    });
    homeBtn.addEventListener('mouseleave', () => {
      homeSVG.style.transform = 'scale(0.9)';
    });
  </script>
  <script>
    function getFormData(form) {
      const obj = Object.fromEntries(new FormData(form));

      // Replace `I don't know` with null.
      Object.entries(obj).forEach(([key, val]) => {
        if (val === `I don't know`) {
          obj[key] = null;
        }
      });

      return obj;
    }

    const titleInput = document.getElementById('bug-report-title');
    const descInput = document.getElementById('bug-report-desc');
    const titleCharCounter = document.getElementById('title-char-counter');
    const descCharCounter = document.getElementById('desc-char-counter');
    function updateCharCounter(input, counter) {
      const inputLength = input.value.length;
      const maxLength = input.maxLength;
      counter.textContent = `${inputLength} / ${maxLength}`;
      counter.style.color = inputLength >= maxLength ? '#f00' : '#000';
    }
    titleInput.addEventListener('input', function() {
      updateCharCounter(this, titleCharCounter);
    });
    descInput.addEventListener('input', function() {
      updateCharCounter(this, descCharCounter);
    });

    
    document.getElementById('bug-report-form').addEventListener('submit', function() {
      document.getElementById('bug-report-submit').disabled = true;
      const { title, desc: body } = getFormData(this);
      fetch('https://clickylatin-api.vercel.app/bug-report', {
        method: 'POST',
        body: JSON.stringify({ title, body }),
        headers: {
          'Content-Type': 'application/json'
        }
      });
    });
  </script>
  <script type="module" src="/src/app/special-themes/apply.js"></script>
  <script type="module" src="/src/get-recent-deployment-msg.js"></script>
</body>
</html>
