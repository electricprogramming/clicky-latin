<!DOCTYPE html>
<html>

<head>
  <style>
    * {
      padding: 0;
      margin: 0;
    }
    div {
      position: fixed;
      margin: 2vmin;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      border: 2vmin solid blueviolet;
      box-shadow: 0 0 0 2vmin orange;
      box-sizing: border-box;
      width: calc(100vw - 4vmin);
      height: calc(100vh - 4vmin);
    }
  </style>
</head>

<body>
<div></div>
</body>

</html>
