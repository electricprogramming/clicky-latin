<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A simple PWA example">
  <title>PWA Example V2</title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="/src/manifest.json">

  <!-- Service Worker Registration -->
  <script>
    window.addEventListener('load', () => {
      // Check if service workers are supported in the browser
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/src/sw.js') // Adjust the path if needed
          .then((registration) => {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch((error) => {
            console.log('Service Worker registration failed:', error);
          });
      }
    });
  </script>
</head>
<body>
  <h1>Welcome to the PWA Example!</h1>
  <p>This page demonstrates a simple Progressive Web App (PWA).</p>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #000;
    }
  </style>
</body>
</html>
