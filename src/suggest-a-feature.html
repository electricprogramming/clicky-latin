<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="Clicky Latin" content="Clicky Latin is a software designed specifically with the goal of helping students to learn Latin via drag-and-drop technology and responsive audio feedback.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <meta name="google-site-verification" content="c2VvJHD-7UVQpVpVi_Y9x3GAge_3c9JJXfz9sC2BPcY" />
  <title>Clicky Latin - Suggest a Feature</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--background);
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow-x: hidden;
    }
    :root {
      --background: #333;
      --foreground-1: #0d3;
      --foreground-2: #09f;
      --foreground-3: #0d3;
      --foreground-4: #09f;
      --main-text: #fff;
      --minor-text: #fff;
      --bright-text: #fff;
      --main-ui: #ccc;
      --ui-accent: #39d;
    }
    .heading {
      color: var(--main-text);
      font-family:'Times New Roman', Times, serif;
      font-size: 10vmin;
      text-align: center;
      margin: 2.5vmin;
    }
    #back-home-svg {
      width: 20vmin;
      height: auto;
      position: fixed;
      bottom: 1vmin;
      right: 1vmin;
      transform: scale(0.9);
      transition: transform 0.3s ease;
      z-index: 100000;
    }
    #back-home-btn {
      user-select: none;
      cursor: pointer;
    }
    #loading-spinner {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1.25vmin solid var(--main-ui);
      border-top: 1.25vmin solid var(--ui-accent);
      border-radius: 50%;
      width: 10vmin;
      height: 10vmin;
      animation: spin 2s linear infinite;
    }
    /* Spin animation */
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(-20deg); }
      25% { transform: translate(-50%, -50%) rotate(55deg); }
      50% { transform: translate(-50%, -50%) rotate(160deg);}
      75% { transform: translate(-50%, -50%) rotate(265deg);}
      100% { transform: translate(-50%, -50%) rotate(340deg); }
    }
    form#suggestion-form {
      display: flex;
      flex-direction: column;
      gap: 2vmin;
      width: 80vw;
      max-width: 600px;

      &, * {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      label {
        &, * {
          padding: 0;
          margin: 0;
        }
        h1 { color: var(--main-text); }
        p { color: var(--minor-text); }
      }

      .char-counter {
        padding: 0;
        margin-top: -1.5vmin;
        display: inline-block;
        font-size: 0.75em;
        text-align: right;
        vertical-align: middle;
        color: var(--minor-text);
      }

      input, textarea {
        padding: 1vmin;
        font-size: 2.5vmin;
        background-color: #555;
        color: var(--minor-text);
        border: 2px solid var(--main-ui);
        border-radius: 0.75vmin;

        &::placeholder {
          color: var(--minor-text);
          opacity: 0.75;
          filter: saturate(80%);
        }
        
        &:focus {
          border: 2px solid var(--ui-accent);
          outline: none;
          box-shadow: none;
        }
      }
      textarea {
        min-height: 20vh;
        max-height: 20vh;
        resize: none;
      }
      button#suggestion-submit {
        padding: 1.5vmin 3vmin;
        font-size: 2.5vmin;
        background: var(--foreground-3);
        color: #000;
        border: none;
        border-radius: 0.75vmin;
        cursor: pointer;
        &:hover:not(:disabled) {
          filter: brightness(0.9);
        }
      }
      button#suggestion-submit:disabled {
        filter: brightness(0.8) saturate(0.7);
        cursor: default;
      }
    }
  </style>
</head>
<body>
  <div id="loading-spinner" style="display: none;"></div>
  <div class="heading">Suggest a new feature for Clicky Latin</div>
  <form id="suggestion-form" onsubmit="event.preventDefault();">
    <label for="suggestion-title">
      <h1>Title</h1>
      <p>Title your suggestion in a few simple words.</p>
    </label>
    <input type="text" id="suggestion-title" name="title" placeholder="A live game mode like Quizlet Live" maxlength="40" required>
    <div class="char-counter" id="title-char-counter">0 / 40</div>

    <label for="suggestion-body">
      <h1>Description</h1>
      <p>Describe your suggestion with more details.</p>
    </label>
    <textarea id="suggestion-body" name="body"
      placeholder="A live game mode, somewhat similar to Quizlet Live, where players race to complete a set the fastest.
Time penalties or other punishments may be given for mistakes."
      maxlength="750" required></textarea>
    <div class="char-counter" id="body-char-counter">0 / 750</div>

    <button id="suggestion-submit" type="submit">Submit suggestion</button>
  </form>
  <svg id="back-home-svg" width="555" height="155" viewbox="0 0 555 155" xmlns="http://www.w3.org/2000/svg">
    <a href="/">
      <g id="back-home-btn" transform="translate(2.5,2.5)">
        <path
          d="M 475,0
            A 75,75 0 1,1 475,150
            H 75
            A 75, 75 0 1,1 75,0
            Z"
          fill="#ddd9"
          stroke="#222"
          stroke-width="5" />
        <text fill="#222" font-family="sans-serif" font-size="80" text-anchor="middle" dominant-baseline="middle" x="275" y="85">Back to Home</text>
      </g>
    </a>
  </svg>
  <script type="module">
    const homeSVG = document.getElementById('back-home-svg');
    const homeBtn = document.getElementById('back-home-btn');
    homeBtn.addEventListener('mouseenter', () => {
      homeSVG.style.transform = 'scale(1.0)';
    });
    homeBtn.addEventListener('mouseleave', () => {
      homeSVG.style.transform = 'scale(0.9)';
    });
  </script>
  <script>
    const form = document.getElementById('suggestion-form');
    const loadingSpinner = document.getElementById('loading-spinner');

    function updateCharCounter(input, counter) {
      const inputLength = input.value.length;
      const maxLength = input.maxLength;
      counter.textContent = `${inputLength} / ${maxLength}`;
      counter.style.color = inputLength >= maxLength ? '#f00' : '#000';
    }
    document.getElementById('suggestion-title').addEventListener('input', function() {
      updateCharCounter(this, document.getElementById('title-char-counter'));
    });
    document.getElementById('suggestion-body').addEventListener('input', function() {
      updateCharCounter(this, document.getElementById('body-char-counter'));
    });

    document.getElementById('suggestion-form').addEventListener('submit', function() {
      loadingSpinner.style.display = 'block';
      const { title, body } = Object.fromEntries(new FormData(this));
      fetch('https://clickylatin-api.vercel.app/feature-suggestion', {
        method: 'POST',
        body: JSON.stringify({ title, body }),
        headers: {
          'Content-Type': 'application/json'
        }
      })
        .then(() => {
          loadingSpinner.style.display = 'none';
          Array.from(form.elements).forEach(el => el.disabled = false);
          form.reset();
          setTimeout(() => alert('This feature suggestion has been successfully submitted.'), 20);
        })
        .catch(err => {
          console.error(err);
          alert('Submission failed. Please try again later.');
        });
      Array.from(form.elements).forEach(el => el.disabled = true);
    });
  </script>
  <script type="module" src="/src/app/special-themes/apply.js"></script>
  <script type="module" src="/src/get-recent-deployment-msg.js"></script>
</body>
</html>
