<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="Clicky Latin" content="Clicky Latin is a software designed specifically with the goal of helping students to learn Latin via drag-and-drop technology and responsive audio feedback.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <meta name="google-site-verification" content="c2VvJHD-7UVQpVpVi_Y9x3GAge_3c9JJXfz9sC2BPcY" />
  <title>Clicky Latin</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--background);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-x: hidden;
    }
    :root {
      --background: #333;
      --main-ui: #555;
      --box-upper: #0d3;
      --box-lower: #09f;
      --foreground-1: #0d3;
      --foreground-2: #09f;
      --main-text: #fff;
      --minor-text: #fff;
      --bright-text: #fff;
      --accent-1: #ccc;
      --accent-2: #39d;
    }
    hr {
      display: block;
      border: 0;
      height: 4px;
      min-height: 4px;
      background-color: var(--accent-1);
      width: 100vw;
      margin: 20px auto;
    }
    #navigation-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: row;
      padding-top: 2vh;
    }
    a.navigation-link {
      margin-left: 2.5vw;
      margin-right: 2.5vw;
      user-select: none;
      text-decoration: none;           /* Remove underline */
      font-family: 'Times New Roman', Times, serif;
      color: var(--main-text);
      font-size: 10vmin;
      transform: scale(1.0);
      transition: transform 0.3s ease;
    }
    a.navigation-link:hover {
      transform: scale(1.1);
    }
    #about-section {
      padding-top: 2vh;
      padding-bottom: 0vh;
      padding-left: 5vw;
      padding-right: 5vw;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .heading {
      color: var(--main-text);
      font-family:'Times New Roman', Times, serif;
      font-size: 15vmin;
    }
    p, p * {
      font-family:'Times New Roman', Times, serif;
      font-size: 6vmin;
      color: var(--minor-text);
      text-indent: 5vw; 
      text-align: justify;
    }
  </style>
</head>
<body>
  <div id="navigation-bar">
    <a class="navigation-link" href="/create" > Create </a>
    <a class="navigation-link" href="/play"   >  Play  </a>
    <a class="navigation-link" href="/search" > Search </a>
  </div>
  <hr/>
  <div id="about-section">
    <div class="heading">Clicky Latin</div>
    <p>
      Clicky Latin is specially designed to help students learn Latin through interactive drag-and-drop technology and responsive audio feedback.
      You can also
      <a href="/suggest-a-feature">suggest a new feature</a>
      or
      <a href="/report-a-bug">report a bug</a>.
    </p>
  </div>
  <script type="module" src="/src/app/special-themes/apply.js"></script>
  <script type="module" src="/src/get-recent-deployment-msg.js"></script>
</body>
</html>
