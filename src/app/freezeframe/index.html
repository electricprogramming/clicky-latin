<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="Clicky Latin" content="Clicky Latin is a software designed specifically with the goal of helping students to learn Latin via drag-and-drop technology and responsive audio feedback.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicky Latin</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script async src="/src/app/special-themes/inherit.js"></script>
  <style>
    html, body {
      background: var(--background);
      overflow: hidden;
      display: block;
      position: fixed;
      width: 100vw;
      height: 100vh;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    :root {
      --background: #0000;
      --foreground-1: #0d3;
      --foreground-2: #09f;
      --foreground-3: #0d3;
      --foreground-4: #09f;
      --main-text: #fff;
      --minor-text: #fff;
      --bright-text: #fff;
      --accent-1: #ccc;
      --accent-2: #39d;
    }
    #loading-spinner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1.25vmin solid var(--accent-1);
      border-top: 1.25vmin solid var(--accent-2);
      border-radius: 50%;
      width: 10vmin;
      height: 10vmin;
      animation: spin 2s linear infinite;
    }
    /* Spin animation */
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(-20deg); }
      25% { transform: translate(-50%, -50%) rotate(55deg); }
      50% { transform: translate(-50%, -50%) rotate(160deg);}
      75% { transform: translate(-50%, -50%) rotate(265deg);}
      100% { transform: translate(-50%, -50%) rotate(340deg); }
    }
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .game-element {
      position: fixed;
      height: 12vmin;
      width: auto;
      user-select: none;
      cursor: grab;
      z-index: 20;
    }
    .game-element[lang="English"] {
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 74% 100%, 66% 69%, 34% 69%, 26% 100%, 0% 100%);
    }
    .game-element[lang="Latin"] {
      clip-path: polygon(0% 100%, 100% 100%, 100% 31%, 76% 31%, 68% 0%, 32% 0%, 24% 31%, 0% 31%);
    }
    svg path.box-upper {
      fill: var(--foreground-1);
    }
    svg path.box-lower {
      fill: var(--foreground-2);
    }
    img#freezeframe-image {
      max-width: 100vw;
      max-height: 100vw;
      width: auto;
      height: auto;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="loading-spinner"></div>
  <script type="module" src="/src/app/freezeframe/script.js"></script>
  <script type="module" src="/src/get-recent-deployment-msg.js"></script>
</body>
</html>
